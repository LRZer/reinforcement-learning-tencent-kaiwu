name: Offline archive and numerical checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU inspection dependencies
        run: |
          python -m pip install numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify original files and source syntax
        run: python scripts/verify_archive.py
      - name: Check checkpoint inference
        run: python scripts/smoke_check.py
      - name: Check numerical behavior
        run: python -m unittest discover -s tests -v
